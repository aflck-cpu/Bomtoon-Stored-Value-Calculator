<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儲值配置計算器</title>
    <style>
        :root {
            --primary-pink: #ff33ae;
            --primary-pink-hover: #e02398;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 頂部粉紅 banner */
        .header-banner {
            background-color: var(--primary-pink);
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        .header-banner h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
            font-weight: 700;
        }

        .header-banner p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* 主體 2 欄佈局 */
        .main-content {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 650px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* 方案卡片區 */
        .plans-selection {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }

        .plan-card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s;
        }

        .plan-card.active {
            border-color: var(--primary-pink);
            background: #fff0f8;
        }

        .plan-card .plan-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .plan-card.active .plan-title {
            color: var(--primary-pink);
        }

        .plan-card .plan-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 輸入區塊 */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        .input-box:focus {
            border-color: var(--primary-pink);
        }

        /* 快速按鈕列 */
        .quick-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-quick {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-quick.clear {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-quick.add {
            background-color: #dbeafe;
            color: #1d4ed8;
        }

        .btn-quick:hover {
            opacity: 0.85;
        }

        .input-group {
            margin-bottom: 16px;
        }

        /* 右側結果面板 */
        .result-panel {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 15px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: var(--text-muted);
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .result-header .status {
            font-weight: 700;
            font-size: 17px;
            color: var(--text-main);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .result-row span:last-child {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-main);
        }

        /* 推薦組合條列式區塊 */
        .combo-list-box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
            min-height: 40px;
        }

        .combo-item {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .combo-item::before {
            content: "•";
            color: var(--primary-pink);
            font-size: 18px;
        }

        .total-cost-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
            margin-top: auto;
        }

        .total-cost-label {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-main);
        }

        .total-cost-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-pink);
        }

        /* 優惠券折價設定區 */
        .coupon-box {
            grid-column: 1 / -1;
            background: #fff0f8;
            border: 1px dashed var(--primary-pink);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .coupon-box label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #d21791;
        }

        .coupon-box input[type="checkbox"] {
            accent-color: var(--primary-pink);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部標題列 -->
    <div class="header-banner">
        <h1>儲值配置計算器</h1>
        <p id="bannerSubText">當前選擇：優惠券與標準方案組合</p>
    </div>

    <div class="main-content">
        <!-- 方案選擇切換 -->
        <div class="plans-selection">
            <div class="plan-card active" onclick="selectPlan('standard', this)">
                <div class="plan-title">標準優惠方案</div>
                <div class="plan-desc">(含 100元券 / 10%折價券)</div>
            </div>
            <div class="plan-card" onclick="selectPlan('simple', this)">
                <div class="plan-title">精簡儲值模式</div>
                <div class="plan-desc">(僅基礎方案對照)</div>
            </div>
        </div>

        <!-- 左側：輸入控制區 -->
        <div class="input-section">
            <div class="input-group">
                <div class="section-title">目前持有的 c 數量</div>
                <input type="number" id="currentC" class="input-box" value="162" placeholder="請輸入現有數值 (例如 0)" oninput="calculate()">
                <div class="quick-btns">
                    <button class="btn-quick clear" onclick="setValue('currentC', 0)">清空</button>
                    <button class="btn-quick add" onclick="addValue('currentC', 100)">+100</button>
                    <button class="btn-quick add" onclick="addValue('currentC', 500)">+500</button>
                </div>
            </div>

            <div class="input-group">
                <div class="section-title">目前持有的 P 點數 (200P = 1c)</div>
                <input type="number" id="currentP" class="input-box" value="13250" placeholder="請輸入 P 點數量" oninput="calculate()">
                <div class="quick-btns">
                    <button class="btn-quick clear" onclick="setValue('currentP', 0)">清空</button>
                    <button class="btn-quick add" onclick="addValue('currentP', 1000)">+1000</button>
                </div>
            </div>

            <div class="input-group">
                <div class="section-title">目標需要的 c 數量</div>
                <input type="number" id="targetC" class="input-box" value="754" placeholder="請直接輸入目標數值" oninput="calculate()">
                <div class="quick-btns">
                    <button class="btn-quick clear" onclick="setValue('targetC', 0)">清空目標</button>
                </div>
            </div>
        </div>

        <!-- 右側：結果與摘要面板 -->
        <div class="result-panel">
            <div>
                <div class="result-header">
                    <span>尚需補充量</span>
                    <span id="neededCDisplay" class="status">等待輸入</span>
                </div>
                
                <div class="section-title" style="font-size: 14px; margin-bottom: 6px;">推薦最佳儲值組合</div>
                <div id="comboDisplayList" class="combo-list-box">
                    <div class="combo-item" style="color: var(--text-muted); font-weight: normal;">等待輸入</div>
                </div>

                <div class="result-row">
                    <span>現有總 C (含 P 換算)</span>
                    <span id="totalExistingDisplay">0 c</span>
                </div>
                <div class="result-row">
                    <span>實際獲得 / 最終總量</span>
                    <span id="finalTotalDisplay">-</span>
                </div>
            </div>

            <div class="total-cost-section">
                <div class="total-cost-label">最低總花費</div>
                <div id="totalCostDisplay" class="total-cost-value">$0</div>
            </div>
        </div>

        <!-- 優惠券勾選設定 -->
        <div class="coupon-box" id="couponSection">
            <span style="font-weight: 700; color: var(--primary-pink);">🎟️ 優惠券：</span>
            <label><input type="checkbox" id="useCoupon1" checked onchange="calculate()"> 100元折價券</label>
            <label><input type="checkbox" id="useCoupon2" checked onchange="calculate()"> 10%折價券</label>
        </div>
    </div>
</div>

<script>
let currentPlanMode = 'standard';

function selectPlan(mode, el) {
    currentPlanMode = mode;
    document.querySelectorAll('.plan-card').forEach(card => card.classList.remove('active'));
    el.classList.add('active');
    
    if(mode === 'standard') {
        document.getElementById('bannerSubText').innerText = "當前選擇：標準優惠方案 (含折價券)";
        document.getElementById('couponSection').style.display = 'flex';
    } else {
        document.getElementById('bannerSubText').innerText = "當前選擇：精簡儲值模式";
        document.getElementById('couponSection').style.display = 'none';
    }
    calculate();
}

function setValue(id, val) {
    document.getElementById(id).value = val;
    calculate();
}

function addValue(id, val) {
    let box = document.getElementById(id);
    box.value = (parseInt(box.value) || 0) + val;
    calculate();
}

function calculate() {
    const currentC = parseInt(document.getElementById("currentC").value) || 0;
    const currentP = parseInt(document.getElementById("currentP").value) || 0;
    const targetC = parseInt(document.getElementById("targetC").value) || 0;
    
    const pointsToC = Math.floor(currentP / 200);
    const totalExistingC = currentC + pointsToC;
    const targetNeededC = Math.max(0, targetC - totalExistingC);

    document.getElementById("totalExistingDisplay").innerText = totalExistingC + " c";
    
    if (targetC <= 0) {
        document.getElementById("neededCDisplay").innerText = "請輸入目標";
        document.getElementById("comboDisplayList").innerHTML = `<div class="combo-item" style="color: var(--text-muted); font-weight: normal;">請輸入數值</div>`;
        document.getElementById("finalTotalDisplay").innerText = "-";
        document.getElementById("totalCostDisplay").innerText = "$0";
        return;
    }

    document.getElementById("neededCDisplay").innerText = targetNeededC + " c";

    const options = [
        { c: 10, cost: 59 },
        { c: 20, cost: 99 },
        { c: 50, cost: 246 },
        { c: 90, cost: 398 },
        { c: 120, cost: 489 },
        { c: 220, cost: 786 },
        { c: 440, cost: 1499 },
        { c: 590, cost: 1989 }
    ];

    const enableCoupon1 = currentPlanMode === 'standard' && document.getElementById("useCoupon1").checked;
    const enableCoupon2 = currentPlanMode === 'standard' && document.getElementById("useCoupon2").checked;

    let results = [];

    function searchCoupons(curC, curCost, lastIdx, path, c1Used, c2Used) {
        if (curC >= targetNeededC) {
            results.push({ cost: curCost, addedC: curC, path: [...path] });
            return;
        }
        for (let i = lastIdx; i < options.length; i++) {
            let opt = options[i];
            searchCoupons(curC + opt.c, curCost + opt.cost, i, [...path, { ...opt, finalPrice: opt.cost, type: '原價' }], c1Used, c2Used);
            
            if (enableCoupon1 && !c1Used && opt.cost >= 500) {
                let discCost = Math.max(0, opt.cost - 100);
                searchCoupons(curC + opt.c, curCost + discCost, i, [...path, { ...opt, finalPrice: discCost, type: '100元券' }], true, c2Used);
            }
            
            if (enableCoupon2 && !c2Used && opt.cost >= 500) {
                let discCost = Math.round(opt.cost * 0.9);
                searchCoupons(curC + opt.c, curCost + discCost, i, [...path, { ...opt, finalPrice: discCost, type: '10%折' }], c1Used, true);
            }
        }
    }

    searchCoupons(0, 0, 0, [], false, false);
    results.sort((a, b) => a.cost - b.cost);

    if (results.length > 0) {
        let best = results[0];
        let finalSumC = totalExistingC + best.addedC;
        
        document.getElementById("totalCostDisplay").innerText = "$" + best.cost;
        document.getElementById("finalTotalDisplay").innerText = finalSumC + " c";
        
        let comboSummary = {};
        best.path.forEach(item => {
            let key = `${item.c}c (${item.type})`;
            if (!comboSummary[key]) {
                comboSummary[key] = { count: 0, totalPrice: 0 };
            }
            comboSummary[key].count += 1;
            comboSummary[key].totalPrice += item.finalPrice;
        });
        
        let htmlContent = "";
        for (let key in comboSummary) {
            let data = comboSummary[key];
            htmlContent += `<div class="combo-item">${key} x<span style="color: #ff0000; font-weight: bold;">${data.count}</span> = $${data.totalPrice}</div>`;
        }
        document.getElementById("comboDisplayList").innerHTML = htmlContent;

    } else {
        document.getElementById("comboDisplayList").innerHTML = `<div class="combo-item" style="color: var(--text-muted); font-weight: normal;">找不到合適組合</div>`;
        document.getElementById("totalCostDisplay").innerText = "$0";
        document.getElementById("finalTotalDisplay").innerText = "-";
    }
}

// 初始化計算
calculate();
</script>

</body>
</html>
